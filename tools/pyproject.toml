[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zanackb"
version = "0.1.0"
description = "Knowledge-base tools for the Zanac MSX disassembly project."
requires-python = ">=3.10"
authors = [{ name = "zanac-re contributors" }]
dependencies = [
    "click>=8.1",
    "pydantic>=2.5",
    "python-frontmatter>=1.0",
    "PyYAML>=6.0",
    "typing-extensions>=4.8",
]

[project.scripts]
zanackb = "zanackb.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["zanackb*"]
